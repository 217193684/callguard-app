name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../CallGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-apk
          path: CallGuard.apk

      - name: Publish to Releases (download link for your phone)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" CallGuard.apk \
            --title "CallGuard build ${{ github.run_number }}" \
            --notes "Open this page on your phone, tap CallGuard.apk to download, then open it to install." \
            --latest
